# Throwaway WordPress stack for tests/smoke.sh. Never left running: the script tears it down with `down -v`.
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
      MARIADB_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30
  wp:
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wp
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
    volumes:
      - wpdata:/var/www/html
  cli:
    image: wordpress:cli-php8.3
    user: "33:33" # www-data of the wp image, so both containers own the same files
    profiles: ["cli"]
    depends_on:
      - wp
    environment: # wp-config.php reads these from the environment
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wp
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
    volumes:
      - wpdata:/var/www/html
      - ../dist:/dist:ro
      - ./out:/out
volumes:
  wpdata:
