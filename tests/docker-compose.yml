# Throwaway WordPress stack for tests/smoke.sh. Never left running: the script tears it down with `down -v`.
# Images are pinned by digest (tag in the comment): a new WordPress, and so a new `tested`, is a deliberate bump.
name: puzzles-site-reports-smoke # fixed, so `down -v` can never touch another project's stack
services:
  db:
    image: mariadb@sha256:d36f18d65a0459510b8b0f643b226a6d299e3206486e2b64ff20754a6d291707 # mariadb:11
    environment:
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
      MARIADB_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30
  wp:
    image: wordpress@sha256:15195799455c0440e34e4890478c0f1af26350ce166df93a402c1affb4fa0695 # wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment: &wp-db # wp-config.php reads these from the environment
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wp
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
    volumes:
      - wpdata:/var/www/html
  cli:
    image: wordpress@sha256:e4980e3ef763ce7535049c05a54e906d95b16370f28ca02fa329a079eebf3f65 # wordpress:cli-php8.3
    user: "33:33" # www-data of the wp image, so both containers own the same files
    profiles: ["cli"]
    depends_on:
      - wp
    environment: *wp-db
    volumes:
      - wpdata:/var/www/html
      - ../dist:/dist:ro
      - ./out:/out
volumes:
  wpdata:
