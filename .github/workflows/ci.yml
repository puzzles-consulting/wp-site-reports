name: CI
on:
  # Every PR runs: main's ruleset requires these checks, and a skipped workflow never reports them, so a docs-only PR
  # would stay blocked. Pushes to main still skip docs-only changes.
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '.claude/**', 'AGENTS.md', 'README.md', 'CHANGELOG.md']
  schedule:
    - cron: '17 6 * * 1' # weekly: third-party plugins and api.wordpress.org change under the version matrix

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.4'] # the floor and the newest: syntax that passes both passes those between
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
      - run: find . -name '*.php' -not -path './tests/*' -print0 | xargs -0 -n1 php -l

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash scripts/build.sh 0.0.0-ci
      - run: bash tests/smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: smoke-out
          path: |
            tests/out/*.json
            tests/out/debug.log
          if-no-files-found: ignore

  # The plugin claims WordPress 5.8+ and PHP 7.4+: the same smoke on the oldest and newer combos (the `smoke` job above
  # is the pinned 7.1 / PHP 8.3 one). Images by digest; Rank Math at the newest release each WordPress supports (none for
  # 5.8: its case skips), Wordfence at its latest (it supports all of them). A PR that touches neither the plugin, its
  # tests nor the workflows passes without running it, so the required checks still report.
  smoke-matrix:
    name: smoke (WordPress ${{ matrix.wp }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { wp: '5.8', php: '7.4', rank_math: none,
              wp_image: 'wordpress@sha256:70246a8dc8282bbe4f9d53d3e88f4b0a2287cdb84b8da356d8bf44542ae14f2d', # 5.8-php7.4-apache
              cli_image: 'wordpress@sha256:946a8b7f237f6cf90d8f04aff952544a0332d43374d598925dcf0180e4441c6c' } # cli-php7.4
          - { wp: '6.0', php: '8.0', rank_math: '1.0.217',
              wp_image: 'wordpress@sha256:943f54b92470f856d9a73bb3a8adbb46da478e1f7e375180e5ad38d14e8ec627', # 6.0-php8.0-apache
              cli_image: 'wordpress@sha256:6d84aa5960f99b3993cc8e4f389148ffc6519fd146d5862d20a494c32e608f11' } # cli-php8.0
          - { wp: '6.4', php: '8.1', rank_math: '1.0.272',
              wp_image: 'wordpress@sha256:4c64df591c9a52a22eb14893ad0e842f43406dd67ce3b012ff433ab930f10695', # 6.4-php8.1-apache
              cli_image: 'wordpress@sha256:ab5fb76caa861f32c21e1d95a057f52007f4af7130fb16a0f68874dabe0549a4' } # cli-php8.1
          - { wp: '6.8', php: '8.2', rank_math: '',
              wp_image: 'wordpress@sha256:1e6215749283955d5c9ffea6c297651ed23cdfdbb91677ad7abd705b2682f2cf', # 6.8-php8.2-apache
              cli_image: 'wordpress@sha256:78ca850ee1052658e98b6c78db71f73af72373a2b2bc2e6fcb3927a289341d6c' } # cli-php8.2
          - { wp: '7.1', php: '8.4', rank_math: '',
              wp_image: 'wordpress@sha256:05f383d5dad5b65b47a12306821744f169c40982e92ac4bd64601d4caff9ade7', # 7.1-php8.4-apache
              cli_image: 'wordpress@sha256:10719513e86fe417166a315cc9421bd9cfedaaaef728ea25af1e20f3d9a09c68' } # cli-php8.4
    env:
      WP_IMAGE: ${{ matrix.wp_image }}
      CLI_IMAGE: ${{ matrix.cli_image }}
      EXPECT_PHP: ${{ matrix.php }}
      RM_VERSION: ${{ matrix.rank_math }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the PR's changed files
          persist-credentials: false
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ] && ! git diff --name-only "$BASE...HEAD" | grep -qE '^(puzzles-site-reports\.php|uninstall\.php|includes/|tests/|scripts/build\.sh|\.github/workflows/)'; then
            echo "run=false" >>"$GITHUB_OUTPUT"; echo "Nothing the matrix tests changed: skipped."
          else
            echo "run=true" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.run == 'true'
        run: bash scripts/build.sh 0.0.0-ci
      - if: steps.scope.outputs.run == 'true'
        run: bash tests/smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.scope.outputs.run == 'true'
        with:
          name: smoke-out-wp${{ matrix.wp }}-php${{ matrix.php }}
          path: |
            tests/out/*.json
            tests/out/debug.log
          if-no-files-found: ignore

  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
      - run: bash tests/promote.sh
