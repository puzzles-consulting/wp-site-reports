name: CI
on:
  pull_request:
    paths-ignore: ['docs/**', '.claude/**', 'AGENTS.md', 'README.md', 'CHANGELOG.md'] # none of them ships
  push:
    branches: [main]
    paths-ignore: ['docs/**', '.claude/**', 'AGENTS.md', 'README.md', 'CHANGELOG.md']

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.4'] # the floor and the newest: syntax that passes both passes those between
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
      - run: find . -name '*.php' -not -path './tests/*' -print0 | xargs -0 -n1 php -l

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash scripts/build.sh 0.0.0-ci
      - run: bash tests/smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: smoke-out
          path: tests/out/*.json
          if-no-files-found: ignore

  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
      - run: bash tests/promote.sh
