name: Release
# A `vX.Y.Z` tag: PHP lint on 7.4 to 8.4, build, smoke on that exact zip, then a PRE-release of the zip alone (no manifest:
# no site sees it until the owner signs and promotes it with scripts/promote.sh, README > Release).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
      - run: find . -name '*.php' -not -path './tests/*' -print0 | xargs -0 -n1 php -l

  release:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Tag must be vX.Y.Z
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad tag: $TAG" >&2; exit 1; }'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The plain build, no --test-overrides: scripts/promote.sh rebuilds the tag and requires this zip's exact sha256.
      - run: bash scripts/build.sh "${TAG#v}"
      - run: bash tests/smoke.sh
      - name: Pre-release the zip only
        run: |
          WP="$(cat tests/out/wp-version.txt)"
          [[ "$WP" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "bad WordPress version: $WP" >&2; exit 1; }
          # Data only, never a command: the owner types `tested` into scripts/promote.sh (README, Release).
          gh release create "$TAG" dist/puzzles-site-reports.zip --prerelease --generate-notes \
            --notes "Tested with WordPress $WP"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
