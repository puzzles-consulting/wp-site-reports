name: Release
# A `vX.Y.Z` tag on main: lint on PHP 7.4, build, smoke on that exact zip, then a PRE-release of the zip alone. This
# workflow only ever makes pre-releases: no site sees one until the owner signs and promotes it (README, Release).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Tag must be vX.Y.Z
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad tag: $TAG" >&2; exit 1; }'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '7.4' # the floor: the tag itself, whatever CI saw on main
      - run: find . -name '*.php' -not -path './tests/*' -print0 | xargs -0 -n1 php -l
      # The plain build, no --test-overrides: the zip the owner reviews and signs (scripts/wp-sr-promote).
      - run: bash scripts/build.sh "${TAG#v}"
      - run: bash tests/smoke.sh
      - name: Pre-release the zip only
        run: |
          WP="$(cat tests/out/wp-version.txt)"
          [[ "$WP" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "bad WordPress version: $WP" >&2; exit 1; }
          # Data only, never a command: the owner types `tested` into the promotion (README, Release).
          gh release create "$TAG" dist/puzzles-site-reports.zip --prerelease --generate-notes \
            --notes "Tested with WordPress $WP"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
